<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer</title>
  <script src="WebApp_hbkpravotice/assets/js/timer.js"></script>
  <style>
    body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  height: 100vh;
  background-color: #fff;
}

#timer-container {
  text-align: center;
  font-weight: 600;
  font-size: 7em;
}

#description {
  font-size: 2em;
}

#data-container {
  display: flex;
  justify-content: space-around;
  width: 80%;
}

.column {
  flex: 1;
  padding: 5px;
  background-color: #fff;
  border: 1px solid #fff;
  border-radius: 8px;
  margin: 0 10px;
}
.column h2{
	margin: 0; /* Remove default margin */
	font-size: 4em;
}
.column p{
	margin: 0; /* Remove default margin */
	font-size: 2em;
}

.column.right
{
	text-align: right;
}
.column.left
{
	text-align: left;
}

  </style>
</head>
<body>

  <div id="description">
    HBK Pravotice
  </div>
  
  <div id="timer-container">
    <span id="timer">00:00</span>
  </div>

  <div id="data-container">
    <div id="team-1" class="column left">
      <h2 id="team1-score">-</h2>
		<div id="team1-penalties">
			<p>0:54</p>
			<p>1:12</p>
		</div>
    </div>

    <div id="team-2" class="column right">
      <h2 id="team2-score">-</h2>
		<div id="team2-penalties">
			<p>0:54</p>
			<p>1:12</p>
		</div>
    </div>
  </div>
</body>
</html>
